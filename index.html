const { useState, useEffect, useRef } = React;
window.storage = {
  get: async (key) => {
    const raw = localStorage.getItem(key);
    if (raw === null) {
      throw new Error("Key not found: " + key);
    }
    return { key, value: raw, shared: false };
  },
  set: async (key, value) => {
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  delete: async (key) => {
    localStorage.removeItem(key);
    return { key, deleted: true, shared: false };
  },
  list: async (prefix) => {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: false };
  }
};

function firebaseTimeout(ms) {
  return new Promise((_, reject) => setTimeout(() => reject(new Error("Firebase timeout")), ms));
}
let dbMod = null;
let authMod = null;
let cachedDb = null;
let cachedAuth = null;
let modulesReady = false;
async function setupFirebase() {
  if (!modulesReady) {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js");
    dbMod = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js");
    authMod = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js");

    cachedDb = dbMod.getDatabase(app);
    cachedAuth = authMod.getAuth(app);
    modulesReady = true;
  }
  await new Promise((resolve, reject) => {
    const unsub = authMod.onAuthStateChanged(cachedAuth, (user) => {
      if (user) {
        unsub();
        resolve(user);
      }
    });
    authMod.signInAnonymously(cachedAuth).catch(reject);
  });
  const { ref, get, set, onValue } = dbMod;
  const db = cachedDb;
  const pathFor = (key) => "tims-shared/" + key;
  window.storage = {
    get: async (key) => {
      const snap = await get(ref(db, pathFor(key)));
      if (!snap.exists() || snap.val() == null) {
        throw new Error("Key not found: " + key);
      }
      return { key, value: snap.val(), shared: true };
    },
    set: async (key, value) => {
      await set(ref(db, pathFor(key)), value);
      return { key, value, shared: true };
    },
    delete: async (key) => {
      await set(ref(db, pathFor(key)), null);
      return { key, deleted: true, shared: true };
    },
    list: async () => ({ keys: [], shared: true })
  };
  window.subscribeStorage = (key, callback) => {
    return onValue(ref(db, pathFor(key)), (snap) => {
      if (snap.exists() && snap.val() != null) {
        callback(snap.val());
      }
    });
  };
  window.__firebaseReady = true;
}
window.retryFirebaseSync = async function() {
  try {
    await Promise.race([setupFirebase(), firebaseTimeout(15e3)]);
    window.__firebaseReady = true;
    console.log("TIMS: tersambung ke Firebase (Realtime Database) \u2014 data tersinkron real-time.");
    return true;
  } catch (e) {
    window.__firebaseReady = false;
    console.warn("TIMS: Firebase tidak tersedia, memakai penyimpanan lokal per-perangkat.", e);
    return false;
  }
};

  const bin = atob(b64);

function threeDigitsToWordsEN(n) {
  let s = "";
  if (n >= 100) {
    s += EN_ONES[Math.floor(n / 100)] + " Hundred";
    n %= 100;
    if (n > 0) s += " ";
  }
  if (n >= 20) {
    s += EN_TENS[Math.floor(n / 10)];
    if (n % 10 > 0) s += "-" + EN_ONES[n % 10];
  } else if (n > 0) {

function numberToWordsEN(num) {
